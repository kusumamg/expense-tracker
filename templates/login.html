{% extends "base.html" %}

{% block title %}Login | FinTrack{% endblock %}

{% block page_title %}Login{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>
        <p>Login to your FinTrack account.</p>

        <form method="POST">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <div style="margin-bottom:20px;">

                <label>
                    <input
                        type="checkbox"
                        name="remember">
                    Remember Me
                </label>

            </div>

            <button
                type="submit"
                class="save-btn">

                Login

            </button>

        </form>

        <p style="margin-top:20px;text-align:center;">
            Don't have an account?

            <a href="/register">

                Register

            </a>

        </p>

    </div>

</div>

{% endblock %}
